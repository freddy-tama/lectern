<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="The water cycle: evaporation, condensation, precipitation and collection">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9E4F0"/>
      <stop offset="1" stop-color="#EEF5EA"/>
    </linearGradient>
    <path id="drop" d="M0 -17 C11 -3 12 8 0 13 C-12 8 -11 -3 0 -17Z"/>
    <marker id="aOrange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#E08A55"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8573BC"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#3F7FB0"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2E8C80"/></marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#sky)"/>
  <!-- sun -->
  <g transform="translate(300 270)" stroke="#F2C14E" stroke-width="12" stroke-linecap="round">
    <line x1="0" y1="-125" x2="0" y2="-155"/><line x1="0" y1="125" x2="0" y2="155"/>
    <line x1="-125" y1="0" x2="-155" y2="0"/><line x1="125" y1="0" x2="155" y2="0"/>
    <line x1="88" y1="-88" x2="110" y2="-110"/><line x1="-88" y1="-88" x2="-110" y2="-110"/>
    <line x1="88" y1="88" x2="110" y2="110"/><line x1="-88" y1="88" x2="-110" y2="110"/>
    <circle r="92" fill="#F6CB5E" stroke="none"/>
  </g>
  <!-- far hill and mountain -->
  <ellipse cx="520" cy="880" rx="520" ry="110" fill="#BBD5B3"/>
  <path d="M760 890 L1000 650 L1130 560 L1280 500 L1400 640 L1560 890Z" fill="#8FA99D"/>
  <path d="M1280 500 L1400 640 L1560 890 L1290 890 L1250 700Z" fill="#7B968B"/>
  <rect x="760" y="880" width="800" height="60" fill="#8FA99D"/>
  <path d="M1280 500 L1215 566 L1250 590 L1280 564 L1318 596 L1345 568Z" fill="#F6F3EA"/>
  <!-- ground -->
  <path d="M0 880 Q380 850 780 890 T1600 870 V1200 H0Z" fill="#B3D1A3"/>
  <path d="M0 1010 Q500 970 980 1020 T1600 1000 V1200 H0Z" fill="#A3C592"/>
  <!-- trees -->
  <g fill="#6E9A78">
    <path d="M1420 930 l34 -86 l34 86Z"/><path d="M1350 950 l28 -72 l28 72Z"/><path d="M1290 940 l24 -62 l24 62Z"/>
  </g>
  <g fill="#7A5C42"><rect x="1449" y="930" width="10" height="22"/><rect x="1373" y="950" width="9" height="18"/><rect x="1309" y="940" width="8" height="16"/></g>
  <!-- runoff stream -->
  <path d="M1060 690 C1010 780 930 830 868 888" fill="none" stroke="#6BAECF" stroke-width="12" stroke-linecap="round"/>
  <!-- lake -->
  <ellipse cx="470" cy="960" rx="270" ry="82" fill="#5BA0C4"/>
  <ellipse cx="470" cy="948" rx="230" ry="56" fill="#74B3D2"/>
  <path d="M330 950 q22 -10 44 0 M520 975 q22 -10 44 0 M440 925 q18 -8 36 0" fill="none" stroke="#DCEEF6" stroke-width="6" stroke-linecap="round"/>
  <!-- cloud -->
  <g fill="#D5E1E8"><circle cx="965" cy="302" r="55"/><circle cx="1035" cy="268" r="75"/><circle cx="1105" cy="306" r="55"/><rect x="905" y="306" width="255" height="70" rx="35"/></g>
  <g fill="#FFFFFF"><circle cx="960" cy="292" r="55"/><circle cx="1030" cy="256" r="75"/><circle cx="1100" cy="296" r="55"/><rect x="900" y="296" width="255" height="70" rx="35"/></g>
  <!-- rain -->
  <g fill="#4C8DB8">
    <use href="#drop" x="925" y="420"/><use href="#drop" x="985" y="470"/><use href="#drop" x="1045" y="425"/>
    <use href="#drop" x="950" y="525"/><use href="#drop" x="1015" y="560"/><use href="#drop" x="1075" y="500"/>
  </g>
  <!-- arrows -->
  <g fill="none" stroke-width="12" stroke-linecap="round">
    <g stroke="#E08A55">
      <path d="M450 895 C430 850 470 820 450 775 S470 705 450 665" marker-end="url(#aOrange)"/>
      <path d="M540 905 C520 860 560 830 540 785 S560 715 540 675" marker-end="url(#aOrange)"/>
      <path d="M630 895 C610 850 650 820 630 775 S650 705 630 665" marker-end="url(#aOrange)"/>
    </g>
    <path d="M660 600 C700 495 770 430 850 392" stroke="#8573BC" marker-end="url(#aPurple)"/>
    <path d="M1115 392 L1115 535" stroke="#3F7FB0" marker-end="url(#aBlue)"/>
    <path d="M884 908 C840 958 795 962 742 950" stroke="#2E8C80" marker-end="url(#aTeal)"/>
  </g>
  <!-- labels -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="32" font-weight="700" text-anchor="middle">
    <rect x="178" y="705" width="242" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.92" stroke="#E08A55" stroke-width="3"/>
    <text x="299" y="743" fill="#9A5326">Evaporation</text>
    <rect x="640" y="508" width="264" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.92" stroke="#8573BC" stroke-width="3"/>
    <text x="772" y="546" fill="#5A4A92">Condensation</text>
    <rect x="1170" y="402" width="262" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.92" stroke="#3F7FB0" stroke-width="3"/>
    <text x="1301" y="440" fill="#2A5F88">Precipitation</text>
    <rect x="800" y="978" width="206" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.92" stroke="#2E8C80" stroke-width="3"/>
    <text x="903" y="1016" fill="#1F6A60">Collection</text>
  </g>
</svg>
